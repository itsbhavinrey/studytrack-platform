<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - StudyTrack learner profile</title>
  <!--
    GitHub Pages serves this file for ANY missing path, at that path's URL,
    for example /studytrack-platform/plans/week-9. A relative "styles.css"
    would then resolve to /studytrack-platform/plans/styles.css and 404 too,
    so this page uses root-relative URLs that start with the site's path.
  -->
  <link rel="stylesheet" href="/studytrack-platform/styles.css">
</head>
<body>
  <header class="site-header">
    <p class="site-name">StudyTrack</p>
  </header>

  <main id="main">
    <h1>Page not found</h1>
    <p class="intro">
      There is no page at this address. The server answered with HTTP status
      404 (Not Found). The address may be mistyped, or the page may have moved.
    </p>
    <p>
      <a href="/studytrack-platform/">Go to the StudyTrack learner profile</a>
    </p>
  </main>

  <footer class="site-footer">
    <p>StudyTrack, published with GitHub Pages.</p>
  </footer>
</body>
</html>
